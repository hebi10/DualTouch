name: DualTouch internal QA AAB
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main commit to sign for internal QA
        type: string
        required: true
      approved:
        description: Sign this commit for the existing internal tester list
        type: boolean
        required: true
        default: false
  workflow_call:
    inputs:
      expected_main_sha:
        type: string
        required: true
      approved:
        type: boolean
        required: true
      expected_version_code:
        type: string
        required: true
    secrets:
      DUALTOUCH_SIGNING_BUNDLE_BASE64:
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ inputs.expected_version_code && format('dualtouch-ops09-signing-{0}', github.run_id) || 'dualtouch-play-release' }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ inputs.expected_main_sha }}

jobs:
  bundle:
    if: github.repository == 'hebi10/DualTouch' && github.ref == 'refs/heads/main' && inputs.approved
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the approved current main commit and successful Android CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android-ci.yml/runs?branch=main&event=push&head_sha=$CANDIDATE_SHA" \
            | jq -e --arg sha "$CANDIDATE_SHA" \
              '.workflow_runs[0] | .head_sha == $sha and .status == "completed" and .conclusion == "success"' > /dev/null
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Confirm approved source version for OPS-09
        if: inputs.expected_version_code
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          RELEASE_APPROVED: ${{ inputs.approved }}
          EXPECTED_VERSION_CODE: ${{ inputs.expected_version_code }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/release.py internal-qa-guard
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Prepare Android SDK and verify bundletool
        run: |
          SDK_MANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          "$SDK_MANAGER" 'platforms;android-36' 'build-tools;35.0.0'
          BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool.jar"
          curl --fail --silent --show-error --location https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$BUNDLETOOL_JAR"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$BUNDLETOOL_JAR" | sha256sum --check
          printf 'BUNDLETOOL_JAR=%s\n' "$BUNDLETOOL_JAR" >> "$GITHUB_ENV"
      - name: Restore the registered DualTouch upload key
        env:
          DUALTOUCH_SIGNING_BUNDLE_BASE64: ${{ secrets.DUALTOUCH_SIGNING_BUNDLE_BASE64 }}
        run: python3 scripts/release/release.py restore
      - name: Sign and independently verify the QA AAB
        env:
          OPS09_VERSION_CODE: ${{ inputs.expected_version_code }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          gradle --no-daemon :app:bundleRelease --max-workers=2
          PYTHONPATH=scripts/release python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          import shutil

          from release import internal_qa_manifest, read_json, verify_aab, write_json

          bundle = Path('app/build/outputs/bundle/release/app-release.aab')
          config = read_json('release/readiness.json')
          identity = internal_qa_manifest(verify_aab(bundle, os.environ['CANDIDATE_SHA'], config), config)
          write_json('play-dist/manifest.json', identity)
          version = identity['version_name']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,49}', version):
              raise ValueError('Version name is not safe for an artifact filename.')
          artifact_name = 'DualTouch.aab' if os.environ.get('OPS09_VERSION_CODE') else f'DualTouch-{version}-internal-qa.aab'
          shutil.copyfile(bundle, Path('play-dist') / artifact_name)
          print(Path('play-dist/manifest.json').read_text(encoding='utf-8'))
          PY
      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.expected_version_code }}
        with:
          path: play-dist/*.aab
          archive: false
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.expected_version_code }}
        with:
          path: play-dist/manifest.json
          archive: false
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: inputs.expected_version_code
        with:
          name: dualtouch-ops09-candidate
          path: play-dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Remove private signing files
        if: always()
        run: python3 scripts/release/release.py cleanup
