name: DualTouch first internal QA AAB
on:
  workflow_dispatch:
    inputs:
      approved:
        description: Sign the fixed source for the existing internal tester list
        type: boolean
        required: true
        default: false
      download_existing:
        description: Provide the already-signed QA AAB as a direct download
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  CANDIDATE_SHA: 14d7360de4ce253659bbd99ab00c9b565737c037
  CANDIDATE_CI: '44700490967'

jobs:
  bundle:
    if: github.repository == 'hebi10/DualTouch' && github.ref == 'refs/heads/main' && inputs.approved && !inputs.download_existing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the approved PR head and its successful Android CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/1" \
            | jq -e --arg sha "$CANDIDATE_SHA" --arg repo "$GITHUB_REPOSITORY" \
              '.state == "open" and .head.sha == $sha and .head.repo.full_name == $repo' > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_CI" \
            | jq -e --arg sha "$CANDIDATE_SHA" \
              '.head_sha == $sha and .path == ".github/workflows/android-ci.yml" and .event == "pull_request" and .status == "completed" and .conclusion == "success"' > /dev/null
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Prepare Android SDK and verify bundletool
        run: |
          SDK_MANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          "$SDK_MANAGER" 'platforms;android-36' 'build-tools;35.0.0'
          BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool.jar"
          curl --fail --silent --show-error --location https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$BUNDLETOOL_JAR"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$BUNDLETOOL_JAR" | sha256sum --check
          printf 'BUNDLETOOL_JAR=%s\n' "$BUNDLETOOL_JAR" >> "$GITHUB_ENV"
      - name: Restore the registered DualTouch upload key
        env:
          DUALTOUCH_SIGNING_BUNDLE_BASE64: ${{ secrets.DUALTOUCH_SIGNING_BUNDLE_BASE64 }}
        run: python3 scripts/release/release.py restore
      - name: Sign and independently verify the QA AAB
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          gradle --no-daemon :app:bundleRelease --max-workers=2
          PYTHONPATH=scripts/release python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil

          from release import read_json, verify_aab, write_json

          bundle = Path('app/build/outputs/bundle/release/app-release.aab')
          config = read_json('release/readiness.json')
          identity = verify_aab(bundle, os.environ['CANDIDATE_SHA'], config)
          identity['distribution'] = 'internal QA only'
          identity['device_qa_passed'] = config['device_qa_passed']
          identity['accessibility_review_ready'] = config['accessibility_review_ready']
          write_json('play-dist/manifest.json', identity)
          shutil.copyfile(bundle, 'play-dist/DualTouch.aab')
          print(Path('play-dist/manifest.json').read_text(encoding='utf-8'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dualtouch-internal-qa-aab-${{ github.run_id }}
          path: play-dist/
          if-no-files-found: error
          retention-days: 14
      - name: Remove private signing files
        if: always()
        run: python3 scripts/release/release.py cleanup

  direct-download:
    if: github.repository == 'hebi10/DualTouch' && github.ref == 'refs/heads/main' && inputs.approved && inputs.download_existing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dualtouch-internal-qa-aab-44701773274
          run-id: '44701773274'
          github-token: ${{ github.token }}
          path: signed-candidate
      - name: Verify and copy the existing approved AAB bytes
        run: |
          printf '%s  %s\n' 78f6774335de3beb4aaef195e91c1b2c927bb861dfbcd4912d057b53e5883d99 signed-candidate/DualTouch.aab | sha256sum --check
          cp signed-candidate/DualTouch.aab DualTouch-0.0.1-poc-internal-qa.aab
      - uses: actions/upload-artifact@v7
        with:
          path: DualTouch-0.0.1-poc-internal-qa.aab
          archive: false
          if-no-files-found: error
          retention-days: 14
