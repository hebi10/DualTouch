name: DualTouch signed AAB only
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact reviewed current main SHA
        type: string
        required: true
      approved:
        description: Explicit approval for this stage and frozen source
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: dualtouch-play-release
  cancel-in-progress: false
env:
  EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
  RELEASE_APPROVED: ${{ inputs.approved }}
  GH_TOKEN: ${{ github.token }}
  RELEASE_STAGE: bundle
jobs:
  bundle:
    if: github.repository == 'hebi10/DualTouch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact main CI, physical QA, policy evidence and explicit approval
        run: python3 scripts/release/release.py guard
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download verified bundletool
        run: |
          BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool.jar"
          curl --fail --silent --show-error --location https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$BUNDLETOOL_JAR"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$BUNDLETOOL_JAR" | sha256sum --check
          printf 'BUNDLETOOL_JAR=%s\n' "$BUNDLETOOL_JAR" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Restore existing upload key without logging private data
        env:
          DUALTOUCH_SIGNING_BUNDLE_BASE64: ${{ secrets.DUALTOUCH_SIGNING_BUNDLE_BASE64 }}
        run: python3 scripts/release/release.py restore
      - name: Build and independently verify signed AAB
        run: |
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:bundleRelease --max-workers=2
          python3 scripts/release/release.py stage
      - uses: actions/upload-artifact@v4
        with:
          name: dualtouch-signed-aab-${{ github.run_id }}
          path: play-dist/
          if-no-files-found: error
          retention-days: 14
      - name: Remove private signing files
        if: always()
        run: python3 scripts/release/release.py cleanup
